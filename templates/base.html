<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's Hardware </title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='alert.css') }}">

</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Peter's Hardware</h1>

            <div class="flex items-center space-x-4">
                {% if current_user.is_authenticated %}
                    <div class="relative group">
                        <button class="focus:outline-none">
                            <span class="text-white">{{ current_user.username }} ({{ current_user.role.capitalize() }})</span>
                        </button>
                        <!-- Dropdown Menu -->
                        <div class="absolute right-0 mt-2 w-48 bg-white text-black rounded shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-300">

                            <a href="{{ url_for('logout') }}" class="block px-4 py-2 hover:bg-gray-200">Logout</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{{ url_for('login') }}" class="text-white">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container mx-auto py-6">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
